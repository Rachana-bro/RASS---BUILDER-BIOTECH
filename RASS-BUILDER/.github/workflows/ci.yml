name: RASS-BUILDER CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Automated Validation & Complete Test Matrix
  # ----------------------------------------------------------------------------
  backend-test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Runtime & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax & Bytecode Compilation Check
        run: |
          python -m compileall backend/
          python -m compileall tests/

      - name: Deterministic Database Schema Initialization
        run: |
          export PYTHONPATH="backend"
          python -m database.schema

      - name: Run Complete Automated Test Suite (110+ Tests)
        run: |
          pytest -v --durations=10

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Compilation & TypeScript Validation
  # ----------------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Compile Frontend Bundle & Validate TypeScript
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Security & Repository Hygiene Audit
  # ----------------------------------------------------------------------------
  security-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Ensure No Committed Secrets or Local Environment Files
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: Real .env file committed to repository!"
            exit 1
          fi
          if git ls-files | grep -E '\.(db|sqlite|log|pt|pth)$'; then
            echo "ERROR: Large binaries or databases tracked by git!"
            exit 1
          fi
          echo "Repository hygiene checks passed."
